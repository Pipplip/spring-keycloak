name: abfallcontainer-service

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abfallcontainer}
      POSTGRES_USER: ${POSTGRES_USER:-abfallcontainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
    volumes:
      - ./docker/keycloak/realm:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  keycloak-admin-init:
    image: quay.io/keycloak/keycloak:26.3.1
    profiles: ["keycloak-bootstrap"]
    entrypoint: ["/bin/bash", "/opt/keycloak/bootstrap/create-admin-user.sh"]
    environment:
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      ABFALLCONTAINER_ADMIN_USERNAME: ${ABFALLCONTAINER_ADMIN_USERNAME:?Set ABFALLCONTAINER_ADMIN_USERNAME in .env}
      ABFALLCONTAINER_ADMIN_PASSWORD: ${ABFALLCONTAINER_ADMIN_PASSWORD:?Set ABFALLCONTAINER_ADMIN_PASSWORD in .env}
    volumes:
      - ./docker/keycloak/bootstrap:/opt/keycloak/bootstrap:ro
    depends_on:
      keycloak:
        condition: service_started

  backend:
    image: amazoncorretto:25
    profiles: ["app"]
    working_dir: /workspace/backend
    command:
      [
        "/bin/sh",
        "-c",
        "./gradlew validateAngularOpenApiOutput --no-daemon && exec ./gradlew bootRun --no-daemon",
      ]
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-abfallcontainer}"
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-abfallcontainer}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_SWAGGER_ENABLED: ${APP_SWAGGER_ENABLED:-false}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8081/realms/abfallcontainer-realm}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/abfallcontainer-realm/protocol/openid-connect/certs
      KEYCLOAK_API_AUDIENCE: ${KEYCLOAK_API_AUDIENCE:-abfallcontainer-backend}
      FRONTEND_ALLOWED_ORIGIN: ${FRONTEND_ALLOWED_ORIGIN:-http://localhost:4200}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend:/workspace/backend
      - ./openapi:/workspace/openapi:ro
      - ./frontend:/workspace/frontend
      - gradle_cache:/root/.gradle
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  frontend:
    image: node:22.23.4
    profiles: ["app"]
    working_dir: /workspace/frontend
    command:
      [
        "/bin/sh",
        "-c",
        "set -eu; npm ci; for attempt in $(seq 1 600); do if test -f build/generated/openapi/typescript-angular/api/catalogue.service.ts; then break; fi; sleep 2; done; if ! test -f build/generated/openapi/typescript-angular/api/catalogue.service.ts; then echo 'The backend did not generate the Angular API client.' >&2; exit 1; fi; npm run start -- --host 0.0.0.0",
      ]
    environment:
      SKIP_API_GENERATION: "true"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:4200"
    volumes:
      - ./frontend:/workspace/frontend
      - frontend_node_modules:/workspace/frontend/node_modules
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  gradle_cache:
  frontend_node_modules:
